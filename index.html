<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6.51 · Stephanie Forno, arquitecta</title>

<link rel="stylesheet" href="comun.css">
<style>
  /* D = B + C: la tarjeta de contacto centrada, y en su centro un solo corte en seco que cambia con las flechas.
     La cabecera es la misma de las demás páginas; el bloque central no repite el nombre. */
  .pliego{max-width:1212px; margin:0 auto; min-height:100svh; display:grid; grid-template-rows:auto 1fr;
          padding:2rem max(16px, env(safe-area-inset-right)) 1.5rem max(16px, env(safe-area-inset-left))}
  main{align-self:center; justify-self:center; display:flex; flex-direction:column; align-items:center; gap:2.25rem; text-align:center; padding-bottom:6svh}
  main p{margin:0}
  .pieza{display:flex; flex-direction:column; align-items:center; gap:.75rem}
  .pieza svg{height:128px; width:auto; max-width:min(84vw,480px)}
  .pieza svg path{fill:none; stroke:#222; stroke-width:1.1; vector-effect:non-scaling-stroke; stroke-linejoin:miter}
  .pieza svg line{stroke:#bdbdbd; stroke-width:.7; vector-effect:non-scaling-stroke}
  .ley{color:var(--dim); font-size:12px}
  .flechas{display:flex; gap:.25rem; font-size:12px; color:var(--dim)}
  .flechas a{cursor:pointer; padding:.35rem .6rem}
  .flechas a[aria-current]{color:var(--ink); text-decoration:underline; text-underline-offset:4px}
  .dato a{text-decoration:underline; text-underline-offset:4px; text-decoration-color:#bdbdbd}
  .dato a:hover{text-decoration-color:var(--ink)}
  .pliego{grid-template-rows:auto 1fr auto}
  .indice{border-top:1px solid var(--hair); padding-top:.9rem; display:flex; gap:3rem; flex-wrap:wrap; font-size:12px}
  .indice div{display:flex; gap:1.25rem; flex-wrap:wrap}
  .indice a{color:var(--ink)}
</style></head>
<body>
<div class="pliego">
  <header>
    <a href="index.html"><b>6.51</b></a>
    <h1>Stephanie Forno</h1>
    <span class="menu"><a href="objetos.html">objetos</a> · <a href="cv.html">info</a> · <a href="mailto:stephaniefornorosas@gmail.com?subject=Consulta%206.51">contacto</a></span>
  </header>
  <main>
    <div class="pieza">
      <a id="ir"><svg id="g" viewBox="0 0 10 10"><line id="s"/><path id="p"/></svg></a>
      <p class="ley" id="ley"></p>
      <p class="flechas" id="fl"></p>
    </div>
    <p class="dim">arquitectura · BIM</p>
    <p class="dato"><a href="mailto:stephaniefornorosas@gmail.com?subject=Consulta%206.51">stephaniefornorosas@gmail.com</a><br>
       <a href="https://www.instagram.com/6.51__/" target="_blank" rel="noopener">instagram</a></p>
    <p class="dato"><a href="objetos.html">objetos · descarga libre</a></p>
  </main>
  <!-- índice: debajo del contacto, en silencio. Los particulares entran cuando exista su cuaderno. -->
  <nav class="indice" aria-label="Proyectos">
    <div><span class="dim">universitarios</span><a href="onemi.html">ONEMI, 2018</a><a href="coihuin.html">CPC, 2020</a></div>
    <div><span class="dim">particulares</span><a href="casa.html">Casa, 2024</a></div>
  </nav>
</div>
<script src="gestos.js"></script>
<script>
  let i=0;
  const g=document.getElementById('g'), p=document.getElementById('p'), s=document.getElementById('s'),
        ley=document.getElementById('ley'), fl=document.getElementById('fl');
  function ver(k){ i=(k+GESTOS.length)%GESTOS.length; const x=GESTOS[i];
    g.setAttribute('viewBox',x.vb); p.setAttribute('d',x.d);
    s.setAttribute('x1',x.suelo[0]); s.setAttribute('x2',x.suelo[2]); s.setAttribute('y1',x.suelo[1]); s.setAttribute('y2',x.suelo[1]);
    ley.textContent=x.a;
    const ir=document.getElementById('ir');   // pinchar el corte abre el cuaderno del proyecto, si ya existe
    if(x.enlace){ ir.href=x.enlace; ir.style.cursor='pointer'; } else { ir.removeAttribute('href'); ir.style.cursor='default'; }
    fl.innerHTML='<a data-k="-1">←</a>'+GESTOS.map((_,j)=>`<a data-j="${j}"${j===i?' aria-current="true"':''}>${String(j+1).padStart(2,'0')}</a>`).join('')+'<a data-k="1">→</a>';
  }
  fl.addEventListener('click',e=>{ const a=e.target.closest('a'); if(!a) return;
    ver(a.dataset.j!==undefined ? +a.dataset.j : i + +a.dataset.k); });
  ver(0);
</script>
<script src="contacto.js"></script>
</body></html>
