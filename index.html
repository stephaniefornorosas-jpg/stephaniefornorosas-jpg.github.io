<style>
  /* Recorrido de láminas: cada paso ocupa una pantalla. Hoy, solo grises. */
  :root{ --ink:#111; --dim:#6b6b6b; --paper:#fff; --rule:#e4e4e4;
         --font:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  *{box-sizing:border-box}
  html{scroll-snap-type:y proximity}
  html,body{margin:0; background:var(--paper); color:var(--ink)}
  body{font-family:var(--font); font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased}
  a{color:inherit; text-decoration:none}
  a:hover{text-decoration:underline; text-underline-offset:3px}

  .lamina{min-height:100svh; scroll-snap-align:start; display:grid; grid-template-rows:auto 1fr auto;
          padding:1.5rem max(16px, env(safe-area-inset-right)) 1.25rem max(16px, env(safe-area-inset-left));
          max-width:1180px; margin:0 auto}
  header{display:grid; grid-template-columns:3rem 1fr; gap:1rem}
  h1{font:inherit; margin:0}
  b{font-weight:700}
  .dim{color:var(--dim)}
  figure{margin:0; align-self:center; padding-block:2rem}
  figure img{display:block; width:100%; height:auto}
  .pie{display:grid; grid-template-columns:3rem 1fr auto; gap:1rem; border-top:1px solid var(--ink); padding-top:.5rem; font-size:13px}
  .cita{font-size:11px; letter-spacing:.02em}
  .sig{color:var(--dim)}
  @media (max-width:600px){ header,.pie{grid-template-columns:2.5rem 1fr} .pie .sig{grid-column:2} }
</style>
</head>
<body>

  <div class="pie">
