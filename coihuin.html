<script>
// Eje N de la lámina 12 (2020): 57,284 % del tramo A→U, abajo de la planta.
const N=57.284;
const PL={x0:.057, span:.884};                          // A y U en el ancho de planta.jpg
const LOMO={a:[.28,.853], u:[.72,.204]};                 // A y U sobre el lomo de la maqueta (cuerpo.jpg)
function dibujar(){
  const box=document.getElementById('pliego').getBoundingClientRect();
  const pl=document.getElementById('planta').getBoundingClientRect();
  const mq=document.getElementById('maqueta').getBoundingClientRect();
  if(!pl.height||!mq.height) return;
  const ox=box.left, oy=box.top, t=N/100;
  const y0=pl.bottom-oy, yi=y0+(mq.top-pl.bottom)*.45;  // la inflexión
  const xp=pl.left-ox+pl.width*(PL.x0+PL.span*t);
  const xm=mq.left-ox+mq.width*(LOMO.a[0]+(LOMO.u[0]-LOMO.a[0])*t);
  const ym=mq.top-oy+mq.height*(LOMO.a[1]+(LOMO.u[1]-LOMO.a[1])*t);
  document.getElementById('ejes').innerHTML=
    `<polyline points="${xp},${y0} ${xp},${yi} ${xm},${ym}"/><circle cx="${xm}" cy="${ym}" r="1.6"/>`;
}
addEventListener('load',dibujar); addEventListener('resize',dibujar);

// Burbuja: se dibuja en canvas (no hay <img> que guardar). Al pasar el cursor, una lupa redonda
// muestra la lámina nítida; al hacer clic se abre entera, con zoom (rueda o pellizco) y arrastre.
const cargar=src=>new Promise(r=>{const i=new Image(); i.onload=()=>r(i); i.src=src;});
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.burbuja,.visor')) e.preventDefault(); });
document.querySelectorAll('.burbuja').forEach(async fig=>{
  const cv=fig.querySelector('canvas'), cx=cv.getContext('2d');
  const [base,nit]=await Promise.all([cargar(fig.dataset.base),cargar(fig.dataset.nitida)]);
  let lupa=null, luz=0, meta=0, anim=0;
  const encender=fig.dataset.modo==='encender';      // la maqueta no usa lupa: se enciende entera
  function pintar(){
    const w=fig.clientWidth, dpr=devicePixelRatio||1, h=w*Number(fig.dataset.ratio);
    if(cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px'; dibujar(); }
    cx.setTransform(dpr,0,0,dpr,0,0);
    cx.clearRect(0,0,w,h); cx.drawImage(base,0,0,w,h);
    if(encender){ if(luz>0){ cx.globalAlpha=luz; cx.drawImage(nit,0,0,w,h); cx.globalAlpha=1; } return; }
    if(!lupa) return;
    const r=Math.max(70,Math.min(150,w*.11)), z=1.6;
    cx.save(); cx.beginPath(); cx.arc(lupa.x,lupa.y,r,0,7); cx.clip();
    cx.fillStyle='#fff'; cx.fillRect(lupa.x-r,lupa.y-r,2*r,2*r);
    cx.drawImage(nit, lupa.x-lupa.x*z, lupa.y-lupa.y*z, w*z, h*z);
    cx.restore();
    cx.beginPath(); cx.arc(lupa.x,lupa.y,r,0,7); cx.strokeStyle='rgba(17,17,17,.25)'; cx.lineWidth=.5; cx.stroke();
  }
  function fundido(){                                 // ~0,7 s hacia encendido o apagado
    luz+=Math.sign(meta-luz)*Math.min(Math.abs(meta-luz),.035); pintar();
    anim = luz!==meta ? requestAnimationFrame(fundido) : 0;
  }
  fig.addEventListener('pointerenter',e=>{ if(!encender||e.pointerType!=='mouse') return; meta=1; if(!anim) fundido(); });
  fig.addEventListener('pointermove',e=>{ if(encender||e.pointerType!=='mouse') return;
    const b=cv.getBoundingClientRect(); lupa={x:e.clientX-b.left,y:e.clientY-b.top}; pintar(); });
  fig.addEventListener('pointerleave',()=>{ lupa=null; meta=0; if(encender){ if(!anim) fundido(); } else pintar(); });
  fig.addEventListener('click',()=>abrir(nit));
  addEventListener('resize',pintar); pintar();
  if(encender && matchMedia('(hover: none)').matches){
    new IntersectionObserver(es=>es.forEach(en=>{ meta=en.isIntersecting?1:0; if(!anim) fundido(); }),{threshold:.5}).observe(fig);
  }
});

const visor=document.getElementById('visor'), vc=visor.querySelector('canvas'), vx=vc.getContext('2d');
let img=null, esc=1, px=0, py=0, arr=null;
function verVisor(){
  const dpr=devicePixelRatio||1, W=innerWidth, H=innerHeight;
  vc.width=W*dpr; vc.height=H*dpr; vx.setTransform(dpr,0,0,dpr,0,0);
  vx.fillStyle='#fff'; vx.fillRect(0,0,W,H);
  vx.drawImage(img,px,py,img.width*esc,img.height*esc);
}
function abrir(i){
  img=i; esc=Math.min(innerWidth*.94/i.width, innerHeight*.9/i.height);
  px=(innerWidth-i.width*esc)/2; py=(innerHeight-i.height*esc)/2;
  visor.classList.add('abierto'); verVisor();
}
function cerrar(){ visor.classList.remove('abierto'); }
visor.querySelector('.cerrar').addEventListener('click',cerrar);
addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });
visor.addEventListener('wheel',e=>{ e.preventDefault();
  const f=Math.exp(-e.deltaY*.0015), n=Math.min(4,Math.max(.2,esc*f)), f2=n/esc;
  px=e.clientX-(e.clientX-px)*f2; py=e.clientY-(e.clientY-py)*f2; esc=n; verVisor(); },{passive:false});
const toques=new Map(); let dist0=0;
visor.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('cerrar')) return;
  visor.setPointerCapture(e.pointerId); toques.set(e.pointerId,e); arr={x:e.clientX-px,y:e.clientY-py};
  if(toques.size===2){ const [a,b]=[...toques.values()]; dist0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/esc; } });
visor.addEventListener('pointermove',e=>{ if(!toques.has(e.pointerId)) return; toques.set(e.pointerId,e);
  if(toques.size===2){ const [a,b]=[...toques.values()], d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const cxm=(a.clientX+b.clientX)/2, cym=(a.clientY+b.clientY)/2, n=Math.min(4,Math.max(.2,d/dist0)), f2=n/esc;
    px=cxm-(cxm-px)*f2; py=cym-(cym-py)*f2; esc=n; }
  else if(arr){ px=e.clientX-arr.x; py=e.clientY-arr.y; }
  verVisor(); });
['pointerup','pointercancel'].forEach(t=>visor.addEventListener(t,e=>{ toques.delete(e.pointerId); if(!toques.size) arr=null; }));
addEventListener('resize',()=>{ if(visor.classList.contains('abierto')) verVisor(); });
</script>
<script>
// etiquetas de ideas: siempre visibles y discretas; cada una abre su idea sin abrir el visor
const pl=document.getElementById('planta');
pl.querySelectorAll('.nota').forEach(n=>n.addEventListener('click',e=>{ e.stopPropagation();
  pl.querySelectorAll('.nota.abierta').forEach(o=>{ if(o!==n) o.classList.remove('abierta'); }); n.classList.toggle('abierta'); }));
</script>
<script>
// Notas de lámina: etiqueta y nota se destacan juntas (cursor, foco o toque).
(function(){
  const todos=[...document.querySelectorAll('.nota[data-n], .ficha li[data-n]')];
  const marca=(n,v)=>document.querySelectorAll('[data-n="'+n+'"]').forEach(e=>e.classList.toggle('sel',v));
  const limpia=()=>document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  const tactil=()=>matchMedia('(hover: none)').matches;
  todos.forEach(e=>{ const n=e.dataset.n;
    e.addEventListener('pointerenter',ev=>{ if(ev.pointerType==='mouse') marca(n,true); });
    e.addEventListener('pointerleave',ev=>{ if(ev.pointerType==='mouse') marca(n,false); });
    e.addEventListener('focus',()=>marca(n,true)); e.addEventListener('blur',()=>marca(n,false));
  });
  document.querySelectorAll('.nota[data-n]').forEach(e=>e.addEventListener('click',ev=>{ ev.stopPropagation();
    if(!tactil()) return;
    const n=e.dataset.n; limpia(); marca(n,true);
    document.querySelector('.ficha li[data-n="'+n+'"]')?.scrollIntoView({behavior:'smooth',block:'center'}); }));
  document.querySelectorAll('.ficha li[data-n]').forEach(e=>e.addEventListener('click',()=>{ if(!tactil()) return;
    const n=e.dataset.n, ya=e.classList.contains('sel'); limpia(); if(!ya) marca(n,true); }));
})();
</script>
