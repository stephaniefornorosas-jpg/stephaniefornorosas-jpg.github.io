  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = s => { const [y,m,d] = s.split('-'); return d + '.' + m + '.' + y.slice(2); };
  const p = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const ul = document.getElementById('a');
  AGENDA.forEach(it => {
    const fin = it.cierre || it.fecha;

    if (p(fin) < hoy) li.className = 'past';
    if (it.nota) li.title = it.nota;
    const fecha = (it.cierre && it.cierre !== it.fecha) ? f(it.fecha) + ' – ' + f(it.cierre) : f(it.fecha);
    const a = document.createElement('a');
    a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
