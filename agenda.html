<!doctype html>

<head>
<meta charset="utf-8">

<meta name="description" content="Concursos, fondos, congresos y cursos de arquitectura en Chile y el sur, con fecha y enlace oficial. 6.51.">
<link rel="stylesheet" href="comun.css?v=4">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* Agenda v2: una lista ordenada por la fecha que importa (cierre en concursos, inicio en eventos), un rótulo de mes en la columna
     de la izquierda y todo lo demás al tocar la fila. Mismas medidas que objetos: columna --col, hilo 1 px, 13/12 px. */
  main{padding:var(--aire) 0 var(--cierre) var(--col)}
  .sub{display:flex; justify-content:space-between; gap:1rem; color:var(--dim); border-bottom:var(--hilo); padding-bottom:.75rem}
  .filtros{display:flex; gap:1.5rem}
  .filtros button{font:inherit; letter-spacing:inherit; color:inherit; background:none; border:0; padding:.4rem 0; margin:-.4rem 0; cursor:pointer}
  .filtros button:hover,.filtros button[aria-pressed=true]{color:var(--ink)}
  .filtros button[aria-pressed=true]{text-decoration:underline; text-underline-offset:4px}
  .filtros button:focus-visible,.f:focus-visible{outline:1px solid var(--ink); outline-offset:2px}

  .mes{display:grid; grid-template-columns:9.25rem minmax(0,1fr)}
  .mes h2{font:inherit; color:var(--dim); margin:0; padding:.75rem 0; border-bottom:var(--hilo)}
  .mes ul{list-style:none; margin:0; padding:0}
  .mes li{border-bottom:var(--hilo)}

  .f{display:grid; grid-template-columns:6rem minmax(0,1fr) 7.5rem; column-gap:1.5rem; width:100%; padding:.75rem 0; text-align:left;
     font:inherit; letter-spacing:inherit; color:var(--ink); background:none; border:0; cursor:pointer}
  .d{position:relative; color:var(--dim); font-variant-numeric:tabular-nums}
  .t{color:var(--dim); text-align:right}
  .f:hover .n{text-decoration:underline; text-underline-offset:4px}
  /* cierra en 14 días o menos: la fecha pasa a tinta y lleva un punto en el margen; es la única marca de la página */
  .pronto .d{color:var(--ink)}
  .pronto .d::before{content:""; position:absolute; left:-14px; top:.55em; width:6px; height:6px; border-radius:50%; background:var(--ink)}
  .venc .f{opacity:.55}

  .x{padding:0 0 .9rem 7.5rem; font-size:var(--t2); color:var(--dim)}
  .x p{margin:0 0 .2rem}
  .x a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:4px}
  .x a:hover{text-decoration-color:var(--ink)}

  @media (max-width:600px){
    .mes{display:block}
    .mes h2{padding:1.1rem 0 .5rem; border-bottom:0}
    .mes:first-of-type h2{padding-top:1rem}
    .f{grid-template-columns:4.4rem minmax(0,1fr); column-gap:.75rem; padding:.85rem 0}
    .f .t{grid-column:2; text-align:left; font-size:var(--t2)}
    .x{padding-left:calc(4.4rem + .75rem)}
    .pronto .d::before{left:-12px}
  }
</style>
</head>
<body>
<div class="pliego">
  <header class="v">
    <h1><span class="sr">Stephanie Forno</span></h1>
    <a class="home" href="index.html" title="Inicio"><b>6.51</b></a>
    <span class="menu"><a href="objetos.html">objetos</a> · <a href="agenda.html" aria-current="page">agenda</a> · <a href="cv.html">info</a> · <a href="mailto:stephaniefornorosas@gmail.com?subject=Consulta%206.51">contacto</a></span>
  </header>
  <main>
    <div class="sub"><nav class="filtros" id="filtros" aria-label="Filtrar por tipo"></nav></div>
    <div id="campo"></div>
  </main>
</div>
<script>
const AGENDA = [
{"fecha":"2026-09-01","cierre":"2026-11-17","nombre":"5.º Premio Latinoamericano de Arquitectura Rogelio Salmona — registro de obras","tipo":"premio","lugar":"en línea","url":"https://www.fundacionrogeliosalmona.org/convocatoriaquintociclo","nota":"Solo obras terminadas entre 2010 y 2020. Costo no publicado."},
{"fecha":"2026-11-11","cierre":"2026-11-27","nombre":"Exposición «Resonancias croatas en la arquitectura de Chile»","tipo":"exposición","lugar":"UAI, Campus Peñalolén, Santiago","url":"https://colegioarquitectos.com/noticias/?p=36090","nota":""},
{"fecha":"2026-11-18","cierre":"2026-11-20","nombre":"Congreso AARQHOS 2026 — Arquitectura para el dolor y la salud mental","tipo":"congreso","lugar":"Hotel Radisson Blu Plaza El Bosque, Las Condes, Santiago","url":"https://congreso2026.aarqhos.cl/","nota":"Arquitectura hospitalaria. 20-11: visitas a obras hospitalarias. Presencial; valor no publicado en la portada."},
{"fecha":"2026-12-03","cierre":"","nombre":"Premio Aporte Urbano 2026 — premiación","tipo":"premio","lugar":"por confirmar","url":"https://colegioarquitectos.com/noticias/?p=35937","nota":"Postulaciones cerraron el 14-10. Ceremonia de premiación."},
{"fecha":"2026-12-03","cierre":"","nombre":"Seminario sobre reutilización en viviendas industrializadas","tipo":"seminario","lugar":"Esc. de Construcción Civil UC, Campus San Joaquín, Santiago","url":"https://colegioarquitectos.com/noticias/?p=36017","nota":"09:00 h."},
{"fecha":"2026-12-03","cierre":"2026-12-05","nombre":"27.º Congreso Nacional de Arquitectos — Territorio, norma y riesgo","tipo":"congreso","lugar":"La Serena","url":"https://colegioarquitectos.com/noticias/?p=35924","nota":"Colegio de Arquitectos y DZ Coquimbo. Abierto a todos los arquitectos. Costo no publicado."},
{"fecha":"2026-12-08","cierre":"2027-03-09","nombre":"eVolo 2027 Skyscraper Competition","tipo":"concurso","lugar":"en línea","url":"https://www.evolo.us/registration-2027-skyscraper-competition/","nota":"USD 135 hasta 08-12; USD 175 hasta 23-02-2027. Confirmar en el sitio oficial."},
{"fecha":"2026-12-10","cierre":"2027-01-18","nombre":"AIA invites: New York Waterfall Market (Buildner)","tipo":"concurso","lugar":"en línea","url":"https://architecturecompetitions.com/newyorkmarket","nota":"Inscripción hasta 10-12, 120 €. Entrega 18-01-2027 (la fuente también dice 2028). Confirmar en el sitio oficial."},
{"fecha":"2026-12-15","cierre":"","nombre":"5.º Premio Rogelio Salmona — obras seleccionadas","tipo":"premio","lugar":"en línea","url":"https://www.fundacionrogeliosalmona.org/convocatoriaquintociclo","nota":"Publicación de la lista de seleccionadas."},
{"fecha":"2026-12-16","cierre":"2026-12-16","nombre":"House of Poetry — YAC (casa de Dino Campana, Marradi)","tipo":"concurso","lugar":"en línea","url":"https://www.youngarchitectscompetitions.com/","nota":"Premio 15.000 €. Cierre confirmado en YAC; costo de inscripción por confirmar."},
{"fecha":"2027-04-26","cierre":"2027-04-30","nombre":"Confluencias Urbanas «Nos une la hospitalidad» — encuentro internacional","tipo":"encuentro","lugar":"Bogotá","url":"https://www.fundacionrogeliosalmona.org/registrodeequiposconfluenciasurbanas","nota":"Inscripción de equipos cerrada (15-10-2026); cartografías seleccionadas el 01-02-2027."},
{"fecha":"2027-04-29","cierre":"","nombre":"5.º Premio Rogelio Salmona — premiación","tipo":"premio","lugar":"por confirmar","url":"https://www.fundacionrogeliosalmona.org/convocatoriaquintociclo","nota":""},
{"fecha":"2027-05-08","cierre":"2027-11-21","nombre":"20.ª Bienal de Arquitectura de Venecia","tipo":"bienal","lugar":"Venecia","url":"https://www.cultura.gob.cl/institucional/subsecretaria-de-las-culturas-y-las-artes-ratifica-al-mismo-jurado-y-anuncia-nuevo-proceso-de-evaluacion-para-el-concurso-de-ideas-del-pabellon-de-chile-en-la-bienal-de-arquitectura-de-venecia-2027/","nota":"Apertura 08-05 confirmada por Mincap; cierre según bases del concurso del Pabellón de Chile (ganador aún por anunciar)."}
];
(function(){
  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const PLAZO = ['concurso','convocatoria','premio'];          // en estos tipos la fecha visible es el cierre
  const GRUPO = {concurso:'concursos', convocatoria:'concursos', premio:'concursos', bienal:'concursos', fondo:'fondos', congreso:'congresos', curso:'cursos'};
  const ORDEN = ['todo','concursos','fondos','congresos','cursos'];  // solo aparecen los que tienen datos
  const PRONTO = 14;                                            // días para marcar «cierra pronto»
  const DIA = 864e5, AUTOCIERRE = 8000;

  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const p = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const dd = s => s.slice(8) + '.' + s.slice(5,7) + '.' + s.slice(2,4);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };

  const items = AGENDA.map(it => {
    const plazo = PLAZO.includes(it.tipo) && !!it.cierre;
    const clave = plazo ? it.cierre : it.fecha;
    const fin = it.cierre || it.fecha;
    const dias = Math.round((p(fin) - hoy) / DIA);
    return Object.assign({}, it, {plazo, clave, fin, dias, venc: dias < 0, pronto: plazo && dias >= 0 && dias <= PRONTO, grupo: GRUPO[it.tipo] || ''});
  }).sort((a, b) => a.clave.localeCompare(b.clave));

  function fechaVisible(it){
    if (it.plazo || !it.cierre || it.cierre === it.fecha) return dd(it.clave).slice(0,5);
    return it.fecha.slice(0,7) === it.cierre.slice(0,7) ? it.fecha.slice(8) + '–' + dd(it.cierre).slice(0,5) : dd(it.fecha).slice(0,5);
  }
  function detalle(it){
    const x = el('div', 'x'); x.hidden = true;
    let l1 = it.plazo ? 'cierra ' + dd(it.cierre) : (it.cierre && it.cierre !== it.fecha ? dd(it.fecha) + ' – ' + dd(it.cierre) : dd(it.fecha));
    if (it.plazo && !it.venc) l1 += it.dias === 0 ? ' · hoy' : ' · en ' + it.dias + (it.dias === 1 ? ' día' : ' días');
    x.appendChild(el('p', '', l1));
    if (it.lugar) x.appendChild(el('p', '', it.lugar));
    if (it.nota) x.appendChild(el('p', '', it.nota));
    const a = el('p'); const l = el('a', '', 'sitio ↗'); l.href = it.url; l.target = '_blank'; l.rel = 'noopener'; a.appendChild(l); x.appendChild(a);
    return x;
  }

  let abierta = null, timer = 0;
  function cerrar(){ clearTimeout(timer); if (abierta){ abierta.b.setAttribute('aria-expanded','false'); abierta.x.hidden = true; abierta = null; } }
  function alternar(b, x){
    const era = abierta && abierta.b === b; cerrar(); if (era) return;
    b.setAttribute('aria-expanded','true'); x.hidden = false; abierta = {b, x};
    timer = setTimeout(cerrar, AUTOCIERRE);                     // como «respaldo a solicitud»: muestra y vuelve a cerrarse
  }
  document.addEventListener('click', e => { if (abierta && !e.target.closest('li')) cerrar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });

  const campo = document.getElementById('campo'), filtros = document.getElementById('filtros');
  function pintar(filtro){
    cerrar(); campo.textContent = '';
    const lista = items.filter(it => filtro === 'todo' || it.grupo === filtro);
    const grupos = [];
    lista.filter(it => !it.venc).forEach(it => {
      const k = it.clave.slice(0,7); let g = grupos[grupos.length-1];
      if (!g || g.k !== k){ g = {k, rotulo: MES[+k.slice(5)-1] + ' ' + k.slice(0,4), its: []}; grupos.push(g); }
      g.its.push(it);
    });
    const v = lista.filter(it => it.venc); if (v.length) grupos.push({k:'v', rotulo:'vencidas', its:v, venc:true});
    grupos.forEach(g => {
      const s = el('section', 'mes' + (g.venc ? ' venc' : '')); s.appendChild(el('h2', '', g.rotulo));
      const ul = el('ul');
      g.its.forEach(it => {
        const li = el('li', it.pronto ? 'pronto' : '');
        const b = el('button', 'f'); b.type = 'button'; b.setAttribute('aria-expanded','false');
        const d = el('span', 'd', fechaVisible(it)); if (it.pronto) d.appendChild(el('span', 'sr', ' cierra pronto'));
        b.append(d, el('span', 'n', it.nombre), el('span', 't', it.tipo));
        const x = detalle(it); b.addEventListener('click', () => alternar(b, x));
        li.append(b, x); ul.appendChild(li);
      });
      s.appendChild(ul); campo.appendChild(s);
    });
  }
  const hay = ORDEN.filter(g => g === 'todo' || items.some(it => it.grupo === g));
  let actual = hay.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'todo';
  hay.forEach(g => {
    const b = el('button', '', g); b.type = 'button'; b.setAttribute('aria-pressed', String(g === actual));
    b.addEventListener('click', () => {
      actual = g; filtros.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      history.replaceState(null, '', g === 'todo' ? location.pathname + location.search : '#' + g); pintar(g);
    });
    filtros.appendChild(b);
  });
  pintar(actual);
})();
</script>
