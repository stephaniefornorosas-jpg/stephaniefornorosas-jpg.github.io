<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV · 6.51</title>
<meta name="description" content="Stephanie Forno, arquitecta. 6.51.">
<meta name="author" content="Stephanie Forno">
<style>
  /* CV en el mismo silencio que el resto: una ficha, sin adjetivos. */
  :root{ --ink:#111; --dim:#6b6b6b; --rule:#e4e4e4; --paper:#fff; --font:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper); color:var(--ink)}
  body{font-family:var(--font); font-size:11px; letter-spacing:.02em; line-height:1.55; -webkit-font-smoothing:antialiased}
  a{color:inherit; text-decoration:none}
  a:hover{text-decoration:underline; text-underline-offset:3px}
  .pliego{max-width:1180px; margin:0 auto; min-height:100svh; display:grid; grid-template-rows:auto auto 1fr auto;
          padding:1.5rem max(16px, env(safe-area-inset-right)) 1.25rem max(16px, env(safe-area-inset-left))}
  header{display:grid; grid-template-columns:3rem 1fr auto; gap:1rem; position:relative}
  header .mail{position:absolute; left:50%; top:0; transform:translateX(-50%)}
  h1{font:inherit; margin:0}
  main{align-self:center; display:grid; grid-template-columns:3rem minmax(0,34rem); gap:1rem; padding:12svh 0}
  dl{margin:0; display:grid; grid-template-columns:9rem 1fr; column-gap:1.5rem; row-gap:.45rem}
  dt{color:var(--dim)}
  dd{margin:0}
  .sep{grid-column:1/-1; border-top:1px solid var(--rule); margin:.6rem 0}
  footer{display:grid; grid-template-columns:3rem 1fr; gap:1rem; color:var(--dim); font-size:10px}
  @media (max-width:600px){ header,main,footer{grid-template-columns:2.5rem 1fr} header .mail{left:auto; right:0; transform:none}
                            dl{grid-template-columns:1fr} dt{margin-top:.6rem} }






  /* cota: navegación. Una línea de cota de 6,51 con marcas a 45°; cada marca es un portal. */
  .cota{position:relative; height:30px; margin:.9rem auto 0; max-width:1180px; width:100%}
  .cota::before{content:""; position:absolute; left:0; right:0; top:11px; border-top:1px solid #cfcfcf; transform:scaleY(.5); transform-origin:top}
  .cota .total{position:absolute; left:50%; top:0; transform:translate(-50%,-3px); padding:0 6px; background:var(--paper); color:#b3b3b3; font-size:9px; letter-spacing:.06em}
  .cota a{position:absolute; top:0; height:30px; min-width:44px; display:flex; flex-direction:column; align-items:center; color:#a8a8a8; font-size:9.5px; text-decoration:none}
  .cota a::before{content:""; width:9px; height:1px; background:currentColor; margin-top:11px; transform:rotate(-45deg)}
  .cota a span{margin-top:6px; white-space:nowrap}
  .cota a:hover, .cota a[aria-current]{color:#444}
  .cota a.ini{align-items:flex-start; transform:translateX(-4px)}
  .cota a.fin{align-items:flex-end; transform:translateX(4px)}
  .cota a.medio{transform:translateX(-50%)}
  .cota a[title="Datos"] span{font-size:12px; margin-top:3px}
  .cota a.mail{color:var(--ink); font-size:10px}
  .cota a.mail::before{width:12px}
  /* fin cota */
</style>
</head>
<body>
<div class="pliego">
  <header>
    <a href="index.html" title="Inicio"><b>6.51</b></a>
    <h1>Stephanie Forno</h1>
  </header>
  <nav class="cota" aria-label="Páginas">
    <a class="ini" style="left:0.000%" href="index.html"><span>Inicio</span></a>
    <a class="medio" style="left:33.333%" href="coihuin.html"><span>CPC</span></a>
    <a class="medio" style="left:66.667%" href="cv.html" aria-current="page" title="Datos" aria-label="Datos"><span>ⓘ</span></a>
    <a class="mail fin" style="right:0" href="mailto:stephaniefornorosas@gmail.com?subject=Consulta%206.51"><span>Contacto</span></a>
    <span class="total" aria-hidden="true">6,51</span>
  </nav>

  <main>
    <span></span>
    <dl>
      <dt>Arquitecta</dt><dd>ULagos, 2020</dd>
      <dt>Sector público</dt><dd>5 años</dd>
      <dt>Formación</dt><dd>Certified Archicad BIM Training I &amp; II<br>Diplomado en Patrimonio, U. de Chile</dd>
      <dt>Publicación</dt><dd>CQ N.º 05, 2024</dd>
      <dd class="sep"></dd>
      <dt>Servicios</dt><dd>Modelado BIM · GDL · Láminas · Visualización</dd>
    </dl>
  </main>

  <footer>
    <span></span>
    <a href="index.html">&larr; Inicio</a>
  </footer>
</div>
<script>
// Contacto: el primer clic muestra y copia la dirección; el segundo abre el correo.
document.querySelectorAll('a.mail').forEach(a=>{
  a.addEventListener('click',e=>{
    if(a.dataset.abierto) return;
    e.preventDefault(); a.dataset.abierto='1';
    const d='stephaniefornorosas@gmail.com';
    (a.querySelector('span')||a).textContent=d;
    try{ navigator.clipboard.writeText(d).then(()=>{ a.title='Copiado'; }); }catch(_){}
  });
});
</script>
</body>
</html>
